services:
  - type: web
    name: sport-garmin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt -r requirements-sync.txt
    startCommand: uvicorn backend.garmin_service:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SUPABASE_URL
        value: https://uelygvkvdlxrewpftyrf.supabase.co
      - key: SUPABASE_USER_ID
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
